<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonBondhu Studio Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #ddd; height: 50px; }
        .logo { font-size: 16px; font-weight: bold; color: #2c3e50; }
        .logo span { color: #f1c40f; }

        .main-container { display: flex; flex: 1; height: calc(100vh - 100px); gap: 10px; padding: 10px; overflow: hidden; }
        
        .sidebar { width: 250px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 10px; overflow-y: auto; }
        .section-title { font-size: 11px; text-transform: uppercase; color: #fff; background: #6c5ce7; padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; font-weight: bold; }
        
        .control-group { margin-bottom: 8px; }
        .control-group label { display: block; font-size: 11px; margin-bottom: 3px; color: #666; font-weight: 600; }
        select, input[type="color"], button.action-btn { width: 100%; padding: 6px 8px; background: #f8f9fa; border: 1px solid #ddd; color: #333; border-radius: 4px; margin-bottom: 4px; font-size: 11px; cursor: pointer; }

        /* স্টেজ ও ক্যানভাস */
        .stage-area { flex: 1; background: #fff; border: 1px solid #ddd; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        .canvas-box { width: 100%; height: 100%; background: linear-gradient(180deg, #dff9fb 0%, #c7ecee 50%, #badc58 50%, #6ab04c 100%); position: relative; overflow: hidden; touch-action: none; }
        
        /* ফিক্সড প্রপস ডিজাইন */
        .scene-house { position: absolute; left: 20px; top: 20px; width: 110px; height: 80px; background: #ff7675; border: 2px solid #d63031; z-index: 1; }
        .scene-house-roof { position: absolute; left: 10px; top: -25px; width: 130px; height: 25px; background: #d63031; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); z-index: 2; }
        
        .scene-tree { position: absolute; right: 20px; top: 20px; width: 60px; height: 80px; background: #27ae60; border-radius: 50% 50% 4px 4px; border: 2px solid #1e8449; z-index: 1; }
        
        .scene-table { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 120px; height: 30px; background: #d35400; border-radius: 4px; border: 2px solid #a04000; z-index: 2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 10px; }

        /* ক্যারেক্টার */
        .draggable-item { position: absolute; cursor: grab; user-select: none; z-index: 5; display: flex; flex-direction: column; align-items: center; }
        .character-rig { width: 80px; height: 160px; }
        #char1 { left: 80px; bottom: 40px; }
        #char2 { right: 80px; bottom: 40px; }

        .char-head { width: 36px; height: 36px; background: #ffeaa7; border-radius: 50%; border: 2px solid #fdcb6e; position: relative; display: flex; align-items: center; justify-content: center; }
        .char-hair { position: absolute; top: -3px; width: 40px; height: 16px; background: #2d3436; border-radius: 15px 15px 4px 4px; }
        .char-hair.girl { background: #d63031; width: 42px; height: 22px; border-radius: 15px 15px 10px 10px; }
        .char-eyes { display: flex; gap: 6px; }
        .char-eye { width: 3px; height: 3px; background: #2d3436; border-radius: 50%; }
        .char-mouth { width: 6px; height: 2px; background: #d63031; margin-top: 2px; }
        
        .char-torso { width: 44px; height: 50px; background: #6c5ce7; border-radius: 4px; margin-top: -2px; }
        .char-limbs { display: flex; justify-content: space-between; width: 52px; margin-top: -42px; z-index: -1; }
        .arm { width: 9px; height: 40px; background: #ffeaa7; border-radius: 3px; transform-origin: top center; }
        .legs { display: flex; justify-content: space-between; width: 30px; margin-top: 8px; z-index: -1; }
        .leg { width: 10px; height: 45px; background: #2d3436; border-radius: 3px; transform-origin: top center; }

        #char2 .char-torso { background: #e17055 !important; }
        .hidden-item { display: none !important; }

        @keyframes walkArm { 0% { transform: rotate(0deg); } 50% { transform: rotate(-20deg); } 100% { transform: rotate(0deg); } }
        @keyframes walkLeg { 0% { transform: rotate(0deg); } 50% { transform: rotate(15deg); } 100% { transform: rotate(0deg); } }
        .walking .arm { animation: walkArm 0.6s infinite ease-in-out; }
        .walking .leg { animation: walkLeg 0.6s infinite ease-in-out; }

        /* টাইমলাইন */
        .bottom-timeline { height: 50px; background: #fff; border-top: 1px solid #ddd; display: flex; align-items: center; justify-content: center; padding: 0 15px; gap: 15px; }
        .bottom-timeline button { padding: 6px 15px; background: #6c5ce7; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .bottom-timeline button.active-play { background: #27ae60; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>▶</span> টুনিবন্ধু স্টুডিও প্রো</div>
    </header>

    <main class="main-container">
        <div class="sidebar">
            <div class="section-title">১. ক্যারেক্টার কন্ট্রোল</div>
            <div class="control-group">
                <label>সক্রিয় চরিত্র</label>
                <select id="activeCharSelect">
                    <option value="char1">হিরো (ছেলে)</option>
                    <option value="char2">টুনি (মেয়ে)</option>
                </select>
            </div>
            <div class="control-group">
                <button class="action-btn" id="toggleChar2Btn">👥 দ্বিতীয় চরিত্র টগল</button>
            </div>
            <div class="control-group">
                <label>পোশাকের রঙ</label>
                <input type="color" id="torsoColor" value="#6c5ce7">
            </div>

            <div class="section-title" style="margin-top: 10px;">২. প্রপস টগল</div>
            <div class="control-group">
                <button class="action-btn" id="toggleHouseBtn">🏠 ঘর টগল</button>
                <button class="action-btn" id="toggleTableBtn">🪑 টেবিল টগল</button>
                <button class="action-btn" id="toggleTreeBtn">🌲 গাছ টগল</button>
            </div>
        </div>

        <div class="stage-area">
            <div class="canvas-box" id="canvasBox">
                <!-- ঘর এবং ছাদ আলাদাভাবে فکسড -->
                <div class="draggable-item" id="houseWrapper" style="left: 20px; top: 20px;">
                    <div class="scene-house-roof" id="houseRoof"></div>
                    <div class="scene-house" id="sceneHouse"></div>
                </div>

                <div class="draggable-item scene-tree" id="sceneTree" style="right: 20px; top: 20px; left: auto;"></div>
                <div class="draggable-item scene-table" id="sceneTable">অধ্যয়ন টেবিল</div>

                <div class="draggable-item character-rig" id="char1">
                    <div class="char-head">
                        <div class="char-hair"></div>
                        <div class="char-eyes"><div class="char-eye"></div><div class="char-eye"></div></div>
                        <div class="char-mouth"></div>
                    </div>
                    <div class="char-limbs"><div class="arm"></div><div class="arm"></div></div>
                    <div class="char-torso" id="torso1"></div>
                    <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                </div>

                <div class="draggable-item character-rig" id="char2">
                    <div class="char-head">
                        <div class="char-hair girl"></div>
                        <div class="char-eyes"><div class="char-eye"></div><div class="char-eye"></div></div>
                        <div class="char-mouth"></div>
                    </div>
                    <div class="char-limbs"><div class="arm"></div><div class="arm"></div></div>
                    <div class="char-torso" id="torso2"></div>
                    <div class="legs"><div class="leg"></div><div class="leg"></div></div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="section-title">৩. অ্যানিমেশন ও এক্সপোর্ট</div>
            <div class="control-group">
                <button class="action-btn" id="walkPresetBtn" style="background: #eafaf1; color: #27ae60;">🚶‍♂️ ওয়াক সাইকেল</button>
                <button class="action-btn" id="exportVideoBtn" style="background: #fef9e7; color: #d35400;">🎬 ভিডিও ডাউনলোড</button>
            </div>
        </div>
    </main>

    <div class="bottom-timeline">
        <button id="playBtn">▶ প্লে ওয়াক</button>
    </div>

    <script>
        function makeDraggable(elm) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elm.onmousedown = dragMouseDown;
            elm.ontouchstart = dragTouchStart;
            function dragMouseDown(e) { e = e || window.event; e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY; document.onmouseup = closeDragElement; document.onmousemove = elementDrag; }
            function elementDrag(e) { e = e || window.event; e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY; elm.style.top = (elm.offsetTop - pos2) + "px"; elm.style.left = (elm.offsetLeft - pos1) + "px"; }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
            function dragTouchStart(e) { let touch = e.touches[0]; pos3 = touch.clientX; pos4 = touch.clientY; document.ontouchend = closeTouchElement; document.ontouchmove = elementTouchDrag; }
            function elementTouchDrag(e) { let touch = e.touches[0]; pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY; pos3 = touch.clientX; pos4 = touch.clientY; elm.style.top = (elm.offsetTop - pos2) + "px"; elm.style.left = (elm.offsetLeft - pos1) + "px"; }
            function closeTouchElement() { document.ontouchend = null; document.ontouchmove = null; }
        }

        makeDraggable(document.getElementById('char1'));
        makeDraggable(document.getElementById('char2'));
        makeDraggable(document.getElementById('houseWrapper'));
        makeDraggable(document.getElementById('sceneTable'));
        makeDraggable(document.getElementById('sceneTree'));

        // টগল লজিক
        let isChar2Visible = true, isHouseVisible = true, isTableVisible = true, isTreeVisible = true, isWalking = false;

        document.getElementById('toggleChar2Btn').addEventListener('click', () => {
            isChar2Visible = !isChar2Visible;
            document.getElementById('char2').classList.toggle('hidden-item', !isChar2Visible);
        });
        document.getElementById('toggleHouseBtn').addEventListener('click', () => {
            isHouseVisible = !isHouseVisible;
            document.getElementById('houseWrapper').classList.toggle('hidden-item', !isHouseVisible);
        });
        document.getElementById('toggleTableBtn').addEventListener('click', () => {
            isTableVisible = !isTableVisible;
            document.getElementById('sceneTable').classList.toggle('hidden-item', !isTableVisible);
        });
        document.getElementById('toggleTreeBtn').addEventListener('click', () => {
            isTreeVisible = !isTreeVisible;
            document.getElementById('sceneTree').classList.toggle('hidden-item', !isTreeVisible);
        });

        document.getElementById('torsoColor').addEventListener('input', (e) => {
            let activeId = document.getElementById('activeCharSelect').value;
            if(activeId === 'char1') { document.getElementById('torso1').style.backgroundColor = e.target.value; }
            else { document.getElementById('torso2').style.backgroundColor = e.target.value; }
        });

        const playBtn = document.getElementById('playBtn');
        function toggleWalking() {
            isWalking = !isWalking;
            const c1 = document.getElementById('char1'), c2 = document.getElementById('char2');
            if(isWalking) {
                c1.classList.add('walking'); c2.classList.add('walking');
                playBtn.classList.add('active-play'); playBtn.innerText = "⏸ থামুন";
            } else {
                c1.classList.remove('walking'); c2.classList.remove('walking');
                playBtn.classList.remove('active-play'); playBtn.innerText = "▶ প্লে ওয়াক";
            }
        }
        playBtn.addEventListener('click', toggleWalking);
        document.getElementById('walkPresetBtn').addEventListener('click', toggleWalking);
        document.getElementById('exportVideoBtn').addEventListener('click', () => { alert("ভিডিও এক্সপোর্ট প্রসেস শুরু হয়েছে!"); });
    </script>
</body>
</html>
