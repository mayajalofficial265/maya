<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonBondhu Studio Pro — All-in-One Cartoon Creator</title>
    <style>
        :root {
            --bg-color: #0f1020;
            --panel-bg: #1a1c38;
            --accent: #7057f5;
            --accent-glow: rgba(112, 87, 245, 0.4);
            --text-main: #ffffff;
            --text-muted: #9492b8;
            --border: #2c2f5a;
            --gold: #f39c12;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: var(--panel-bg); border-bottom: 1px solid var(--border); }
        .logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--accent); }
        .badge-pro { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: bold; text-transform: uppercase; }

        .main-container { display: grid; grid-template-columns: 280px 1fr 320px; flex: 1; height: calc(100vh - 70px); overflow: hidden; }
        
        .sidebar-left { background: var(--panel-bg); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .sidebar-right { background: var(--panel-bg); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        
        h3 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 15px; letter-spacing: 1px; }
        
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-main); }
        select, input[type="range"], input[type="color"], button { width: 100%; padding: 10px; background: #25284d; border: 1px solid var(--border); color: #fff; border-radius: 8px; margin-bottom: 10px; outline: none; }
        button { background: var(--accent); font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; box-shadow: 0 0 10px var(--accent-glow); }
        button.active-anim { background: #27ae60; box-shadow: 0 0 10px rgba(39, 174, 96, 0.5); }
        button.recording { background: #e74c3c; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .stage-area { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle, #1f2249 0%, #0f1020 100%); }
        
        .canvas-box { width: 400px; height: 500px; background: radial-gradient(circle, #1f2249 0%, #0f1020 100%); border: 2px dashed var(--border); border-radius: 20px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: 0.3s; }
        
        .character-rig { position: relative; width: 150px; height: 300px; transition: 0.3s; z-index: 2; }
        .part { position: absolute; transition: transform 0.2s ease; }
        .head { width: 80px; height: 80px; background: #eab18e; border-radius: 50%; top: 0; left: 35px; display: flex; align-items: center; justify-content: center; }
        
        .face { position: relative; width: 100%; height: 100%; }
        .eyes { position: absolute; top: 30px; left: 20px; width: 40px; display: flex; justify-content: space-between; }
        .eye { width: 8px; height: 8px; background: #333; border-radius: 50%; }
        .mouth { position: absolute; bottom: 20px; left: 32px; width: 16px; height: 8px; background: #333; border-radius: 0 0 10px 10px; transition: 0.15s; }

        .torso { width: 90px; height: 110px; background: var(--accent); border-radius: 15px; top: 80px; left: 30px; }
        .arm-left { width: 25px; height: 90px; background: #eab18e; border-radius: 12px; top: 85px; left: 2px; transform-origin: top center; }
        .arm-right { width: 25px; height: 90px; background: #eab18e; border-radius: 12px; top: 85px; left: 123px; transform-origin: top center; }
        .leg-left { width: 30px; height: 100px; background: #39415d; border-radius: 12px; top: 185px; left: 38px; transform-origin: top center; }
        .leg-right { width: 30px; height: 100px; background: #39415d; border-radius: 12px; top: 185px; left: 82px; transform-origin: top center; }

        @keyframes walkLeftArm { 0% { transform: rotate(0deg); } 50% { transform: rotate(-30deg); } 100% { transform: rotate(0deg); } }
        @keyframes walkRightArm { 0% { transform: rotate(0deg); } 50% { transform: rotate(30deg); } 100% { transform: rotate(0deg); } }
        @keyframes walkLeftLeg { 0% { transform: rotate(0deg); } 50% { transform: rotate(25deg); } 100% { transform: rotate(0deg); } }
        @keyframes walkRightLeg { 0% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } 100% { transform: rotate(0deg); } }

        .walking .arm-left { animation: walkLeftArm 0.8s infinite ease-in-out; }
        .walking .arm-right { animation: walkRightArm 0.8s infinite ease-in-out; }
        .walking .leg-left { animation: walkLeftLeg 0.8s infinite ease-in-out; }
        .walking .leg-right { animation: walkRightLeg 0.8s infinite ease-in-out; }

        .timeline { position: absolute; bottom: 20px; width: 90%; background: var(--panel-bg); border: 1px solid var(--border); padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 15px; z-index: 10; }
        .timeline button { width: 120px; margin: 0; }
        .timeline input { margin: 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>✦</span> টুনিবন্ধু স্টুডিও প্রো (ToonBondhu Pro)</div>
        <div class="badge-pro">ফ্রিমিয়াম সংস্করণ</div>
    </header>

    <main class="main-container">
        <!-- বাম পাশের প্যানেল: ক্যারেক্টার ও ব্যাকগ্রাউন্ড কন্ট্রোল -->
        <div class="sidebar-left">
            <h3>১. ক্যারেক্টার পার্টস</h3>
            <div class="control-group">
                <label>বডি স্টাইল</label>
                <select id="bodyStyle">
                    <option value="normal">স্ট্যান্ডার্ড হিরো</option>
                    <option value="chibi">কিউট চিবি</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>মুখের ভাব (Expression)</label>
                <select id="expressionSelect">
                    <option value="smile">খুশি (Smile)</option>
                    <option value="serious">গম্ভীর (Serious)</option>
                    <option value="surprised">অবাক (Surprised)</option>
                </select>
            </div>

            <div class="control-group">
                <label>পোশাকের রঙ (Outfit Color)</label>
                <input type="color" id="torsoColor" value="#7057f5">
            </div>

            <h3>২. সিন ও ব্যাকগ্রাউন্ড</h3>
            <div class="control-group">
                <label>স্টেজ ব্যাকগ্রাউন্ড থিম</label>
                <select id="bgThemeSelect">
                    <option value="studio">স্টুডিও নাইট (ডিফল্ট)</option>
                    <option value="nature">সবুজ প্রকৃতি (Nature)</option>
                    <option value="sunset">গোধূলি আকাশ (Sunset)</option>
                    <option value="cyber">সাইবার পাঙ্ক (Cyber)</option>
                </select>
            </div>

            <div class="control-group">
                <label>হাত নাড়ানোর জয়েন্ট</label>
                <input type="range" id="armPos" min="-45" max="45" value="0">
            </div>
            <div class="control-group">
                <label>পা নাড়ানোর জয়েন্ট</label>
                <input type="range" id="legPos" min="-30" max="30" value="0">
            </div>
        </div>

        <!-- মাঝের প্যানেল: স্টেজ ও প্রিভিউ -->
        <div class="stage-area">
            <div class="canvas-box" id="canvasBox">
                <div class="character-rig" id="characterRig">
                    <div class="part arm-left" id="leftArm"></div>
                    <div class="part arm-right" id="rightArm"></div>
                    <div class="part torso" id="torsoPart"></div>
                    <div class="part head">
                        <div class="face">
                            <div class="eyes">
                                <div class="eye"></div>
                                <div class="eye"></div>
                            </div>
                            <div class="mouth" id="mouthPart"></div>
                        </div>
                    </div>
                    <div class="part leg-left" id="leftLeg"></div>
                    <div class="part leg-right" id="rightLeg"></div>
                </div>
            </div>

            <div class="timeline">
                <button id="playBtn">▶ প্লে ওয়াক</button>
                <input type="range" min="0" max="100" value="0" id="timeSlider">
            </div>
        </div>

        <!-- ডান পাশের প্যানেল: ভয়েস, অডিও ও অ্যানিমেশন -->
        <div class="sidebar-right">
            <h3>৩. ভয়েস ও সাউন্ড স্টুডিও</h3>
            <div class="control-group">
                <label>ডায়লগ ভয়েস রেকর্ডিং</label>
                <button id="micRecordBtn">🎙️ ভয়েস রেকর্ড শুরু করুন</button>
            </div>
            <div class="control-group">
                <label>সাউন্ড এফেক্টস (SFX)</label>
                <button onclick="alert('পপ সাউন্ড বাজানো হয়েছে!')">💥 পপ ইফেক্ট</button>
                <button onclick="alert('হাসির সাউন্ড বাজানো হয়েছে!')">😂 ফানি লাফটার</button>
            </div>

            <h3>৪. প্রিসেট অ্যানিমেশন</h3>
            <div class="control-group">
                <button id="walkPresetBtn">🚶‍♂️ হাঁটার স্টাইল টগল</button>
                <button id="talkPresetBtn">🗣️ কথা বলা অ্যাকশন</button>
            </div>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
            
            <button style="background: linear-gradient(135deg, #27ae60, #2ecc71);" onclick="alert('প্রজেক্ট সফলভাবে সেভ ও এক্সপোর্ট হয়েছে!')">💾 প্রজেক্ট সেভ ও এক্সপোর্ট</button>
        </div>
    </main>

    <script>
        // হাত ও পায়ের জয়েন্ট কন্ট্রোল
        const armPos = document.getElementById('armPos');
        const leftArm = document.getElementById('leftArm');
        const rightArm = document.getElementById('rightArm');
        
        armPos.addEventListener('input', (e) => {
            let val = e.target.value;
            leftArm.style.transform = `rotate(${val}deg)`;
            rightArm.style.transform = `rotate(${-val}deg)`;
        });

        const legPos = document.getElementById('legPos');
        const leftLeg = document.getElementById('leftLeg');
        const rightLeg = document.getElementById('rightLeg');

        legPos.addEventListener('input', (e) => {
            let val = e.target.value;
            leftLeg.style.transform = `rotate(${val}deg)`;
            rightLeg.style.transform = `rotate(${-val}deg)`;
        });

        // পোশাকের রঙ পরিবর্তন
        const torsoColor = document.getElementById('torsoColor');
        const torsoPart = document.getElementById('torsoPart');
        torsoColor.addEventListener('input', (e) => {
            torsoPart.style.backgroundColor = e.target.value;
        });

        // ব্যাকগ্রাউন্ড থিম পরিবর্তন
        const bgThemeSelect = document.getElementById('bgThemeSelect');
        const canvasBox = document.getElementById('canvasBox');
        bgThemeSelect.addEventListener('change', (e) => {
            let theme = e.target.value;
            if(theme === 'studio') {
                canvasBox.style.background = 'radial-gradient(circle, #1f2249 0%, #0f1020 100%)';
            } else if(theme === 'nature') {
                canvasBox.style.background = 'linear-gradient(135deg, #2ecc71 0%, #27ae60 50%, #1e8449 100%)';
            } else if(theme === 'sunset') {
                canvasBox.style.background = 'linear-gradient(135deg, #f39c12 0%, #e74c3c 50%, #8e44ad 100%)';
            } else if(theme === 'cyber') {
                canvasBox.style.background = 'linear-gradient(135deg, #00ffff 0%, #ff00ff 50%, #110022 100%)';
            }
        });

        // মুখের ভাব পরিবর্তন
        const expressionSelect = document.getElementById('expressionSelect');
        const mouthPart = document.getElementById('mouthPart');
        expressionSelect.addEventListener('change', (e) => {
            let expr = e.target.value;
            if(expr === 'smile') {
                mouthPart.style.width = '16px';
                mouthPart.style.height = '8px';
                mouthPart.style.borderRadius = '0 0 10px 10px';
            } else if(expr === 'serious') {
                mouthPart.style.width = '16px';
                mouthPart.style.height = '3px';
                mouthPart.style.borderRadius = '2px';
            } else if(expr === 'surprised') {
                mouthPart.style.width = '10px';
                mouthPart.style.height = '12px';
                mouthPart.style.borderRadius = '50%';
            }
        });

        // ভয়েস রেকর্ডিং সিমুলেশন লজিক
        const micRecordBtn = document.getElementById('micRecordBtn');
        let isRecording = false;
        micRecordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if(isRecording) {
                micRecordBtn.classList.add('recording');
                micRecordBtn.innerText = '🔴 রেকর্ডিং চলছে... (বন্ধ করুন)';
            } else {
                micRecordBtn.classList.remove('recording');
                micRecordBtn.innerText = '🎙️ ভয়েস রেকর্ড শুরু করুন';
                alert('ভয়েস সফলভাবে রেকর্ড ও লিপ-সিঙ্কের সাথে যুক্ত হয়েছে!');
            }
        });

        // অ্যানিমেশন প্লে এবং ওয়াকিং টগল লজিক
        const characterRig = document.getElementById('characterRig');
        const playBtn = document.getElementById('playBtn');
        const walkPresetBtn = document.getElementById('walkPresetBtn');
        const talkPresetBtn = document.getElementById('talkPresetBtn');

        let isWalking = false;
        function toggleWalking() {
            isWalking = !isWalking;
            if(isWalking) {
                characterRig.classList.add('walking');
                playBtn.classList.add('active-anim');
                playBtn.innerText = '⏸ থামুন';
                walkPresetBtn.classList.add('active-anim');
            } else {
                characterRig.classList.remove('walking');
                playBtn.classList.remove('active-anim');
                playBtn.innerText = '▶ প্লে ওয়াক';
                walkPresetBtn.classList.remove('active-anim');
            }
        }

        playBtn.addEventListener('click', toggleWalking);
        walkPresetBtn.addEventListener('click', toggleWalking);

        // কথা বলার অ্যাকশন সিমুলেশন
        let isTalking = false;
        talkPresetBtn.addEventListener('click', () => {
            isTalking = !isTalking;
            if(isTalking) {
                talkPresetBtn.classList.add('active-anim');
                talkPresetBtn.innerText = '🗣️ কথা বলা বন্ধ করুন';
                window.talkInterval = setInterval(() => {
                    let w = Math.random() > 0.5 ? '14px' : '8px';
                    let h = Math.random() > 0.5 ? '10px' : '4px';
                    mouthPart.style.width = w;
                    mouthPart.style.height = h;
                }, 200);
            } else {
                talkPresetBtn.classList.remove('active-anim');
                talkPresetBtn.innerText = '🗣️ কথা বলা অ্যাকশন';
                clearInterval(window.talkInterval);
                mouthPart.style.width = '16px';
                mouthPart.style.height = '8px';
            }
        });
    </script>
</body>
</html>
