<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToonBondhu Studio Pro — All-in-One Cartoon Creator</title>
    <style>
        :root {
            --bg-color: #f4f7fc;
            --panel-bg: #ffffff;
            --accent: #7057f5;
            --text-main: #333333;
            --text-muted: #666666;
            --border: #e0e6ed;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* হেডার স্টাইল */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 25px; background: var(--panel-bg); border-bottom: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-size: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; color: #2c3e50; }
        .logo span { color: #f39c12; font-size: 24px; }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .lang-toggle { display: flex; background: #eef2f7; border-radius: 20px; padding: 3px; border: 1px solid var(--border); }
        .lang-btn { background: transparent; border: none; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; cursor: pointer; color: #555; transition: 0.2s; }
        .lang-btn.active { background: var(--accent); color: #fff; }
        .badge-pro { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; font-size: 11px; padding: 5px 12px; border-radius: 20px; font-weight: bold; text-transform: uppercase; box-shadow: 0 2px 5px rgba(243, 156, 18, 0.4); }

        /* মূল কন্টেইনার */
        .main-container { display: grid; grid-template-columns: 300px 1fr 310px; flex: 1; height: calc(100vh - 130px); overflow: hidden; gap: 10px; padding: 10px; }
        
        .sidebar { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; overflow-y: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        
        .section-title { font-size: 13px; text-transform: uppercase; color: #fff; background: var(--accent); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; letter-spacing: 0.5px; }
        
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        select, input[type="range"], input[type="color"], button.action-btn { width: 100%; padding: 9px 12px; background: #f8fafc; border: 1px solid var(--border); color: #333; border-radius: 8px; margin-bottom: 6px; outline: none; font-size: 13px; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
        button.action-btn:hover { background: #edf2f7; border-color: var(--accent); }

        /* স্টেজ ও ক্যানভাস */
        .stage-area { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; background: #ffffff; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        
        .canvas-box { width: 450px; height: 440px; background: radial-gradient(circle, #eef2f7 0%, #dfe4ea 100%); border: 2px dashed #cbd5e1; border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; touch-action: none; }
        
        .draggable-item { position: absolute; cursor: grab; user-select: none; z-index: 5; }
        .draggable-item:active { cursor: grabbing; }

        /* চরিত্র রিগ ডিজাইন */
        .character-rig { width: 120px; height: 250px; }
        #char1 { left: 60px; top: 100px; }
        #char2 { right: 60px; top: 100px; }

        .part { position: absolute; transition: transform 0.2s ease; }
        .head { width: 65px; height: 65px; background: #f5cba7; border-radius: 50%; top: 0; left: 27px; display: flex; align-items: center; justify-content: center; }
        
        /* চুল এবং দাড়ি */
        .hair { position: absolute; width: 71px; height: 32px; background: #2c3e50; top: -4px; left: -3px; border-radius: 35px 35px 10px 10px; z-index: 2; }
        .hair.girl { background: #8e44ad; width: 75px; height: 45px; border-radius: 35px 35px 25px 25px; }
        .beard { position: absolute; width: 40px; height: 25px; background: #2c3e50; bottom: 5px; left: 12px; border-radius: 0 0 15px 15px; z-index: 2; display: none; }

        .face { position: relative; width: 100%; height: 100%; z-index: 3; }
        .eyes { position: absolute; top: 23px; left: 15px; width: 33px; display: flex; justify-content: space-between; }
        .eye { width: 6px; height: 6px; background: #333; border-radius: 50%; }
        .mouth { position: absolute; bottom: 12px; left: 25px; width: 13px; height: 6px; background: #333; border-radius: 0 0 6px 6px; }

        .torso { width: 75px; height: 95px; background: var(--accent); border-radius: 10px; top: 65px; left: 22px; }
        .arm-left { width: 20px; height: 75px; background: #f5cba7; border-radius: 8px; top: 70px; left: 2px; transform-origin: top center; }
        .arm-right { width: 20px; height: 75px; background: #f5cba7; border-radius: 8px; top: 70px; left: 98px; transform-origin: top center; }
        .leg-left { width: 23px; height: 85px; background: #34495e; border-radius: 8px; top: 155px; left: 28px; transform-origin: top center; }
        .leg-right { width: 23px; height: 85px; background: #34495e; border-radius: 8px; top: 155px; left: 68px; transform-origin: top center; }

        #char2 .torso { background: #e74c3c !important; }

        /* প্রপস ও আসবাবপত্র */
        .prop-item { padding: 10px 15px; border-radius: 8px; font-weight: bold; text-align: center; font-size: 12px; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        #propHouse { width: 130px; height: 90px; background: #9b59b6; border-radius: 8px 8px 0 0; left: 160px; top: 40px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
        #propTable { width: 110px; height: 32px; background: #d35400; border-radius: 6px; left: 170px; top: 310px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
        #propTree { width: 65px; height: 85px; background: #27ae60; border-radius: 50% 50% 8px 8px; left: 15px; top: 230px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }

        .hidden-item { display: none !important; }

        /* অ্যানিমেশন কিফ্রেম */
        @keyframes walkLeftArm { 0% { transform: rotate(0deg); } 50% { transform: rotate(-25deg); } 100% { transform: rotate(0deg); } }
        @keyframes walkRightArm { 0% { transform: rotate(0deg); } 50% { transform: rotate(25deg); } 100% { transform: rotate(0deg); } }
        @keyframes walkLeftLeg { 0% { transform: rotate(0deg); } 50% { transform: rotate(20deg); } 100% { transform: rotate(0deg); } }
        @keyframes walkRightLeg { 0% { transform: rotate(0deg); } 50% { transform: rotate(-20deg); } 100% { transform: rotate(0deg); } }

        .walking .arm-left { animation: walkLeftArm 0.8s infinite ease-in-out; }
        .walking .arm-right { animation: walkRightArm 0.8s infinite ease-in-out; }
        .walking .leg-left { animation: walkLeftLeg 0.8s infinite ease-in-out; }
        .walking .leg-right { animation: walkRightLeg 0.8s infinite ease-in-out; }

        /* বটম টাইমলাইন কন্ট্রোল */
        .bottom-timeline { grid-column: 1 / -1; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .timeline-controls { display: flex; gap: 8px; }
        .timeline-controls button { padding: 8px 14px; background: #eef2f7; border: 1px solid var(--border); border-radius: 8px; font-weight: bold; cursor: pointer; color: #333; transition: 0.2s; }
        .timeline-controls button:hover { background: var(--accent); color: #fff; }
        .timeline-controls button.active-play { background: #27ae60; color: #fff; }
        .timeline-slider-box { display: flex; align-items: center; gap: 15px; width: 55%; }
        .timeline-slider-box input { flex: 1; accent-color: var(--accent); }
        .time-counter { font-size: 13px; font-weight: bold; color: var(--text-muted); background: #f8fafc; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>▶</span> <span id="t-logo">টুনিবন্ধু স্টুডিও প্রো</span></div>
        <div class="header-right">
            <div class="lang-toggle">
                <button class="lang-btn active" id="bnBtn">বাংলা</button>
                <button class="lang-btn" id="enBtn">English</button>
            </div>
            <div class="badge-pro" id="t-badge">Pro Studio</div>
        </div>
    </header>

    <main class="main-container">
        <!-- বাম প্যানেল: ক্যারেক্টার ও প্রপস -->
        <div class="sidebar">
            <div class="section-title"><span id="t-sec1">১. ক্যারেক্টার ও লুক</span> <span>👤</span></div>
            <div class="control-group">
                <label id="t-lbl-char">সক্রিয় চরিত্র</label>
                <select id="activeCharSelect">
                    <option value="char1" id="t-opt-c1">চরিত্র ১: হিরো (ছেলে)</option>
                    <option value="char2" id="t-opt-c2">চরিত্র ২: টুনি (মেয়ে)</option>
                </select>
            </div>
            
            <div class="control-group">
                <button class="action-btn" id="toggleChar2Btn"><span>👥 দ্বিতীয় চরিত্র আনুন</span> <span>›</span></button>
            </div>

            <div class="control-group">
                <label id="t-lbl-hair">চুলের স্টাইল (Hair Style)</label>
                <select id="hairStyleSelect">
                    <option value="normal" id="t-hair-norm">সাধারণ চুল</option>
                    <option value="spiky" id="t-hair-spiky">স্টাইলিশ চুল</option>
                    <option value="bald" id="t-hair-bald">ছোট চুল / শেভড</option>
                </select>
            </div>

            <div class="control-group">
                <label id="t-lbl-expr">মুখের ভাব (Expression)</label>
                <select id="expressionSelect">
                    <option value="smile" id="t-opt-smile">খুশি (Smile)</option>
                    <option value="serious" id="t-opt-serious">গম্ভীর (Serious)</option>
                    <option value="surprised" id="t-opt-surprised">অবাক (Surprised)</option>
                </select>
            </div>

            <div class="control-group">
                <label id="t-lbl-color">পোশাকের রঙ (Outfit Color)</label>
                <input type="color" id="torsoColor" value="#7057f5">
            </div>

            <div class="section-title" style="margin-top: 15px;"><span id="t-sec2">২. প্রপস ও আসবাব</span> <span>🏠</span></div>
            <div class="control-group">
                <button class="action-btn" id="toggleHouseBtn" style="color: #8e44ad;"><span>🏠 ঘর-বাড়ি যোগ করুন</span> <span>›</span></button>
                <button class="action-btn" id="toggleTableBtn" style="color: #d35400;"><span>🪑 টেবিল যোগ করুন</span> <span>›</span></button>
                <button class="action-btn" id="toggleTreeBtn" style="color: #27ae60;"><span>🌲 গাছ যোগ করুন</span> <span>›</span></button>
            </div>
        </div>

        <!-- মাঝের স্টেজ এলাকা -->
        <div class="stage-area">
            <div class="canvas-box" id="canvasBox">
                <!-- প্রপস -->
                <div class="draggable-item prop-item hidden-item" id="propHouse">ঘর (House)</div>
                <div class="draggable-item prop-item hidden-item" id="propTable">টেবিল (Table)</div>
                <div class="draggable-item prop-item hidden-item" id="propTree">গাছ (Tree)</div>

                <!-- চরিত্র ১ (হিরো - ছেলে) -->
                <div class="draggable-item character-rig" id="char1">
                    <div class="part arm-left"></div>
                    <div class="part arm-right"></div>
                    <div class="part torso" id="torsoPart1"></div>
                    <div class="part head">
                        <div class="hair" id="hair1"></div>
                        <div class="face">
                            <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                            <div class="beard" id="beard1"></div>
                            <div class="mouth" id="mouthPart1"></div>
                        </div>
                    </div>
                    <div class="part leg-left"></div>
                    <div class="part leg-right"></div>
                </div>

                <!-- চরিত্র ২ (টুনি - মেয়ে) -->
                <div class="draggable-item character-rig hidden-item" id="char2">
                    <div class="part arm-left"></div>
                    <div class="part arm-right"></div>
                    <div class="part torso" style="background: #e74c3c;"></div>
                    <div class="part head" style="background: #fadbd8;">
                        <div class="hair girl" id="hair2"></div>
                        <div class="face">
                            <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                            <div class="mouth" id="mouthPart2"></div>
                        </div>
                    </div>
                    <div class="part leg-left"></div>
                    <div class="part leg-right"></div>
                </div>
            </div>
        </div>

        <!-- ডান প্যানেল: ভয়েস ও এক্সপোর্ট -->
        <div class="sidebar">
            <div class="section-title"><span id="t-sec3">৩. রিয়েল ভয়েস</span> <span>🎙️</span></div>
            <div class="control-group">
                <button class="action-btn" id="micRecordBtn" style="background: #ebf5fb; color: #2980b9; border-color: #3498db;"><span>🎙️ মাইক লিপ-সিঙ্ক</span> <span>▶</span></button>
            </div>

            <div class="section-title" style="margin-top: 15px;"><span id="t-sec4">৪. অ্যানিমেশন</span> <span>🚶‍♂️</span></div>
            <div class="control-group">
                <button class="action-btn" id="walkPresetBtn" style="background: #eafaf1; color: #27ae60; border-color: #2ecc71;"><span>🚶‍♂️ ওয়াক সাইকেল</span> <span>›</span></button>
            </div>

            <div class="section-title" style="margin-top: 15px;"><span id="t-sec5">৫. এক্সপোর্ট</span> <span>🎬</span></div>
            <div class="control-group">
                <button class="action-btn" id="exportVideoBtn" style="background: #fef9e7; color: #d35400; border-color: #f39c12;"><span>🎬 ভিডিও ডাউনলোড</span> <span>↓</span></button>
                <button class="action-btn" id="shareBtn" style="background: #f4ecf7; color: #8e44ad; border-color: #9b59b6;"><span>🔗 সোশ্যাল শেয়ার</span> <span>↗</span></button>
            </div>
        </div>

        <!-- নিচের টাইমলাইন প্যানেল -->
        <div class="bottom-timeline">
            <div class="timeline-controls">
                <button id="rewindBtn">⏮️</button>
                <button id="playBtn">▶ প্লে ওয়াক</button>
                <button id="pauseBtn">⏸</button>
                <button id="stopBtn">⏹</button>
            </div>
            <div class="timeline-slider-box">
                <input type="range" min="0" max="100" value="0" id="timeSlider">
                <div class="time-counter" id="timeDisplay">00:05 / 00:30</div>
            </div>
        </div>
    </main>

    <script>
        // ভাষা অনুবাদ ডাটা
        const translations = {
            bn: {
                logo: "টুনিবন্ধু স্টুডিও প্রো",

                optSerious: "গম্ভীর (Serious)",
                optSurprised: "অবাক (Surprised)",
                lblColor: "পোশাকের রঙ (Outfit Color)",
                sec2: "২. প্রপস ও আসবাব",
                btnHouseAdd: "🏠 ঘর-বাড়ি যোগ করুন",

                alertExport: "ভিডিও এক্সপোর্ট প্রসেস শুরু হয়েছে!",

            en: {
                logo: "ToonBondhu Studio Pro",
                sec1: "1. Character & Look",
                lblChar: "Active Character",
                optC1: "Character 1: Hero (Boy)",
                optC2: "Character 2: Tuni (Girl)",
                btnChar2Add: "👥 Add 2nd Character",
                btnChar2Rem: "❌ Remove 2nd Character",

                btnHouseAdd: "🏠 Add House",
                btnHouseRem: "❌ Remove House",
                btnTableAdd: "🪑 Add Table",
                btnTableRem: "❌ Remove Table",
                btnTreeAdd: "🌲 Add Tree",
                btnTreeRem: "❌ Remove Tree",
                sec3: "3. Real Voice",
                micLive: "🎙️ Mic Lip-Sync",
                micOff: "🔴 Stop Mic",
                sec4: "4. Animation",
                walkToggle: "🚶‍♂️ Walk Cycle",
                sec5: "5. Export",
                exportBtn: "🎬 Download Video",
                shareBtn: "🔗 Social Share",
                playWalk: "▶ Play Walk",
                pauseWalk: "⏸ Pause",
                alertShare: "Studio link copied!",
                alertExport: "Video export process started!",
                alertMicErr: "Microphone permission denied!"
            }
        };

        let currentLang = 'bn';
        const bnBtn = document.getElementById('bnBtn');
        const enBtn = document.getElementById('enBtn');

        function setLanguage(lang) {
            currentLang = lang;
            if(lang === 'bn') {
                bnBtn.classList.add('active');
                enBtn.classList.remove('active');
            } else {
                enBtn.classList.add('active');
                bnBtn.classList.remove('active');
            }
            let t = translations[lang];
            document.getElementById('t-logo').innerText = t.logo;
            document.getElementById('t-sec1').innerText = t.sec1;
            document.getElementById('t-lbl-char').innerText = t.lblChar;
            document.getElementById('t-opt-c1').innerText = t.optC1;
            document.getElementById('t-opt-c2').innerText = t.optC2;
            document.getElementById('toggleChar2Btn').children[0].innerText = isChar2Visible ? t.btnChar2Rem : t.btnChar2Add;
            document.getElementById('t-lbl-hair').innerText = t.lblHair;
            document.getElementById('t-hair-norm').innerText = t.hairNorm;
            document.getElementById('t-hair-spiky').innerText = t.hairSpiky;
            document.getElementById('t-hair-bald').innerText = t.hairBald;
            document.getElementById('t-lbl-expr').innerText = t.lblExpr;
            document.getElementById('t-opt-smile').innerText = t.optSmile;
            document.getElementById('t-opt-serious').innerText = t.optSerious;
            document.getElementById('t-opt-surprised').innerText = t.optSurprised;
            document.getElementById('t-lbl-color').innerText = t.lblColor;
            document.getElementById('t-sec2').innerText = t.sec2;
            document.getElementById('toggleHouseBtn').children[0].innerText = isHouseVisible ? t.btnHouseRem : t.btnHouseAdd;
            document.getElementById('toggleTableBtn').children[0].innerText = isTableVisible ? t.btnTableRem : t.btnTableAdd;
            document.getElementById('toggleTreeBtn').children[0].innerText = isTreeVisible ? t.btnTreeRem : t.btnTreeAdd;
            document.getElementById('t-sec3').innerText = t.sec3;
            document.getElementById('micRecordBtn').children[0].innerText = isMicActive ? t.micOff : t.micLive;
            document.getElementById('t-sec4').innerText = t.sec4;
            document.getElementById('walkPresetBtn').children[0].innerText = t.walkToggle;
            document.getElementById('t-sec5').innerText = t.sec5;
            document.getElementById('exportVideoBtn').children[0].innerText = t.exportBtn;
            document.getElementById('shareBtn').children[0].innerText = t.shareBtn;
            document.getElementById('playBtn').innerText = isWalking ? t.pauseWalk : t.playWalk;
        }

        bnBtn.addEventListener('click', () => setLanguage('bn'));
        enBtn.addEventListener('click', () => setLanguage('en'));

        let isChar2Visible = false, isHouseVisible = false, isTableVisible = false, isTreeVisible = false;
        let isMicActive = false, isWalking = false;

        // ড্র্যাগ অ্যান্ড ড্রপ লজিক
        function makeDraggable(elm) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elm.onmousedown = dragMouseDown;
            elm.ontouchstart = dragTouchStart;

            function dragMouseDown(e) {
                e = e || window.event; e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }
            function elementDrag(e) {
                e = e || window.event; e.preventDefault();
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                elm.style.top = (elm.offsetTop - pos2) + "px";
                elm.style.left = (elm.offsetLeft - pos1) + "px";
            }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }

            function dragTouchStart(e) {
                let touch = e.touches[0];
                pos3 = touch.clientX; pos4 = touch.clientY;
                document.ontouchend = closeTouchElement;
                document.ontouchmove = elementTouchDrag;
            }
            function elementTouchDrag(e) {
                let touch = e.touches[0];
                pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX; pos4 = touch.clientY;
                elm.style.top = (elm.offsetTop - pos2) + "px";
                elm.style.left = (elm.offsetLeft - pos1) + "px";
            }
            function closeTouchElement() { document.ontouchend = null; document.ontouchmove = null; }
        }

        makeDraggable(document.getElementById('char1'));
        makeDraggable(document.getElementById('char2'));
        makeDraggable(document.getElementById('propHouse'));
        makeDraggable(document.getElementById('propTable'));
        makeDraggable(document.getElementById('propTree'));

        // টগল কন্ট্রোলস
        const toggleChar2Btn = document.getElementById('toggleChar2Btn');
        const char2 = document.getElementById('char2');
        toggleChar2Btn.addEventListener('click', () => {
            isChar2Visible = !isChar2Visible;
            let t = translations[currentLang];
            if(isChar2Visible) {
                char2.classList.remove('hidden-item');
                toggleChar2Btn.style.background = '#fdedec';
                toggleChar2Btn.style.color = '#c0392b';
                toggleChar2Btn.children[0].innerText = t.btnChar2Rem;
            } else {
                char2.classList.add('hidden-item');
                toggleChar2Btn.style.background = '#f8fafc';
                toggleChar2Btn.style.color = '#333';
                toggleChar2Btn.children[0].innerText = t.btnChar2Add;
            }
        });

        const toggleHouseBtn = document.getElementById('toggleHouseBtn');
        const propHouse = document.getElementById('propHouse');
        toggleHouseBtn.addEventListener('click', () => {
            isHouseVisible = !isHouseVisible;
            let t = translations[currentLang];
            if(isHouseVisible) { propHouse.classList.remove('hidden-item'); toggleHouseBtn.style.background = '#fdedec'; toggleHouseBtn.style.color = '#c0392b'; toggleHouseBtn.children[0].innerText = t.btnHouseRem; }
            else { propHouse.classList.add('hidden-item'); toggleHouseBtn.style.background = '#f8fafc'; toggleHouseBtn.style.color = '#8e44ad'; toggleHouseBtn.children[0].innerText = t.btnHouseAdd; }
        });

        const toggleTableBtn = document.getElementById('toggleTableBtn');
        const propTable = document.getElementById('propTable');
        toggleTableBtn.addEventListener('click', () => {
            isTableVisible = !isTableVisible;
            let t = translations[currentLang];
            if(isTableVisible) { propTable.classList.remove('hidden-item'); toggleTableBtn.style.background = '#fdedec'; toggleTableBtn.style.color = '#c0392b'; toggleTableBtn.children[0].innerText = t.btnTableRem; }
            else { propTable.classList.add('hidden-item'); toggleTableBtn.style.background = '#f8fafc'; toggleTableBtn.style.color = '#d35400'; toggleTableBtn.children[0].innerText = t.btnTableAdd; }
        });

        const toggleTreeBtn = document.getElementById('toggleTreeBtn');
        const propTree = document.getElementById('propTree');
        toggleTreeBtn.addEventListener('click', () => {
            isTreeVisible = !isTreeVisible;
            let t = translations[currentLang];
            if(isTreeVisible) { propTree.classList.remove('hidden-item'); toggleTreeBtn.style.background = '#fdedec'; toggleTreeBtn.style.color = '#c0392b'; toggleTreeBtn.children[0].innerText = t.btnTreeRem; }
            else { propTree.classList.add('hidden-item'); toggleTreeBtn.style.background = '#f8fafc'; toggleTreeBtn.style.color = '#27ae60'; toggleTreeBtn.children[0].innerText = t.btnTreeAdd; }
        });

        // চুল ও কাস্টমাইজেশন
        document.getElementById('hairStyleSelect').addEventListener('change', (e) => {
            let style = e.target.value;
            let activeId = document.getElementById('activeCharSelect').value;
            let hair = activeId === 'char1' ? document.getElementById('hair1') : document.getElementById('hair2');
            if(hair) {
                if(style === 'normal') { hair.style.display = 'block'; hair.style.height = activeId === 'char1' ? '32px' : '45px'; }
                else if(style === 'spiky') { hair.style.display = 'block'; hair.style.height = '40px'; }
                else if(style === 'bald') { hair.style.display = 'none'; }
            }
        });

        // পোশাকের রঙ
        document.getElementById('torsoColor').addEventListener('input', (e) => {
            let activeId = document.getElementById('activeCharSelect').value;
            if(activeId === 'char1') {
                document.getElementById('torsoPart1').style.backgroundColor = e.target.value;
            } else {
                const torso2 = document.querySelector('#char2 .torso');
                if(torso2) torso2.style.backgroundColor = e.target.value;
            }
        });

        // মুখের ভাব
        document.getElementById('expressionSelect').addEventListener('change', (e) => {
            let expr = e.target.value;
            let activeId = document.getElementById('activeCharSelect').value;
            let mouth = activeId === 'char1' ? document.getElementById('mouthPart1') : document.getElementById('mouthPart2');
            if(mouth) {
                if(expr === 'smile') { mouth.style.width = '13px'; mouth.style.height = '6px'; mouth.style.borderRadius = '0 0 6px 6px'; }
                else if(expr === 'serious') { mouth.style.width = '13px'; mouth.style.height = '3px'; mouth.style.borderRadius = '2px'; }
                else if(expr === 'surprised') { mouth.style.width = '8px'; mouth.style.height = '9px'; mouth.style.borderRadius = '50%'; }
            }
        });

        // ওয়াকিং অ্যানিমেশন
        const playBtn = document.getElementById('playBtn');
        const walkPresetBtn = document.getElementById('walkPresetBtn');
        function toggleWalking() {
            isWalking = !isWalking;
            let t = translations[currentLang];
            const c1 = document.getElementById('char1'), c2 = document.getElementById('char2');
            if(isWalking) {
                c1.classList.add('walking'); c2.classList.add('walking');
                playBtn.classList.add('active-play'); playBtn.innerText = t.pauseWalk;
            } else {
                c1.classList.remove('walking'); c2.classList.remove('walking');
                playBtn.classList.remove('active-play'); playBtn.innerText = t.playWalk;
            }
        }
        playBtn.addEventListener('click', toggleWalking);
        walkPresetBtn.addEventListener('click', toggleWalking);

        // এক্সপোর্ট ও শেয়ার অ্যালার্ট
        document.getElementById('exportVideoBtn').addEventListener('click', () => { alert(translations[currentLang].alertExport); });
        document.getElementById('shareBtn').addEventListener('click', () => { alert(translations[currentLang].alertShare); });
    </script>
</body>
</html>
